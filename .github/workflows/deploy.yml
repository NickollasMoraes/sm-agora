# Gera o site e publica no GitHub Pages a cada push na branch main
# (o agente faz um push sempre que uma notícia é aprovada).
name: Publicar site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          # Variáveis em Settings > Secrets and variables > Actions > Variables
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_WHATSAPP_CANAL: ${{ vars.WHATSAPP_CANAL }}
      - name: Domínio próprio (CNAME)
        if: ${{ vars.DOMINIO != '' }}
        run: echo "${{ vars.DOMINIO }}" > out/CNAME
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
